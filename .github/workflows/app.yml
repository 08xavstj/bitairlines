name: App

# Builds and tests the iPhone app on a Mac runner. The author develops on Windows and cannot run Xcode locally.
# macOS minutes cost ten times Linux minutes on a private repo, so this runs only when the commit message contains [app]
# or someone starts it by hand (Actions tab, Run workflow). Trimmed logs go to the `ci-logs-app` branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Only a real app build replaces a running one; a push without [app] lands in its own group and cancels nothing.
concurrency:
  group: app-${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[app]') }}
  cancel-in-progress: true

jobs:
  app:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[app]')
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      CI_LOG_BRANCH: ci-logs-app
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          mkdir -p ci-out
          { xcodebuild -version; swift --version; ruby -v; } 2>&1 | tee ci-out/toolchain.log

      - name: Generate Xcode project
        id: gen
        continue-on-error: true
        run: |
          set -o pipefail
          { gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document; } 2>&1 | tail -3
          ruby tools/generate_xcodeproj.rb 2>&1 | tee ci-out/generate.log

      - name: Build and test
        id: apptest
        continue-on-error: true
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 17 Pro \(" | head -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "simulator: $UDID"
          xcodebuild test -project BitAirlines.xcodeproj -scheme BitAirlines \
            -destination "id=$UDID" -derivedDataPath build/DD \
            ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO 2>&1 | tee ci-out/app-test.log

      - name: Screenshots
        id: shots
        continue-on-error: true
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 17 Pro \(" | head -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          bash tools/ci_screenshots.sh build/DD/Build/Products/Debug-iphonesimulator/BitAirlines.app "$UDID" 2>&1 | tee ci-out/screenshots.log

      - name: Publish logs
        if: always()
        run: |
          tools/ci_publish_logs.sh "generate=${{ steps.gen.outcome }}" "app_build_and_test=${{ steps.apptest.outcome }}" "screenshots=${{ steps.shots.outcome }}"

      - name: Fail if any step failed
        if: always()
        run: |
          for o in "${{ steps.gen.outcome }}" "${{ steps.apptest.outcome }}"; do
            [ "$o" = "success" ] || { echo "a step did not succeed: $o"; exit 1; }
          done
