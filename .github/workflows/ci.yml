name: CI

# Builds and tests on a Mac runner, because the game's author develops on Windows and cannot run Xcode locally.
# Trimmed logs are pushed to the `ci-logs` branch (tools/ci_publish_logs.sh) so compiler errors can be read without a GitHub login.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          mkdir -p ci-out
          { xcodebuild -version; swift --version; ruby -v; xcrun simctl list devices available | grep -i iphone | head -8; } 2>&1 | tee ci-out/toolchain.log

      - name: Core purity
        id: purity
        continue-on-error: true
        run: |
          set -o pipefail
          tools/check-core-purity.sh AirlineCore/Sources 2>&1 | tee ci-out/purity.log

      - name: Core tests
        id: core
        continue-on-error: true
        run: |
          set -o pipefail
          swift test --package-path AirlineCore 2>&1 | tee ci-out/core-test.log

      - name: Generate Xcode project
        id: gen
        continue-on-error: true
        run: |
          set -o pipefail
          { gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document; } 2>&1 | tail -3
          ruby tools/generate_xcodeproj.rb 2>&1 | tee ci-out/generate.log

      - name: Build app
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build -project BitAirlines.xcodeproj -scheme BitAirlines \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ci-out/app-build.log

      - name: App tests
        id: apptest
        continue-on-error: true
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "simulator: $UDID"
          xcodebuild test -project BitAirlines.xcodeproj -scheme BitAirlines \
            -destination "id=$UDID" -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ci-out/app-test.log

      - name: Publish logs
        if: always()
        run: |
          tools/ci_publish_logs.sh \
            "purity=${{ steps.purity.outcome }}" \
            "core_tests=${{ steps.core.outcome }}" \
            "generate=${{ steps.gen.outcome }}" \
            "app_build=${{ steps.build.outcome }}" \
            "app_tests=${{ steps.apptest.outcome }}"

      - name: Fail if any step failed
        if: always()
        run: |
          for o in "${{ steps.purity.outcome }}" "${{ steps.core.outcome }}" "${{ steps.gen.outcome }}" "${{ steps.build.outcome }}" "${{ steps.apptest.outcome }}"; do
            [ "$o" = "success" ] || { echo "a step did not succeed: $o"; exit 1; }
          done
